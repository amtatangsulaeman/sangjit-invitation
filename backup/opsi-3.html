<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sangjit – Opsi 3 Classic Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+SC:wght@900&family=Pinyon+Script&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/figma/opsi.css?v=202611250856">
<style>
  :root{--bg:#8c171a;--ink:#dbb266;--petal:#dbb266}
  .floral{position:absolute;width:221px;height:272px}
  .floral > div{position:absolute}
  .floral > div > img{position:absolute;display:block;width:auto;height:auto;max-width:none}
  /* each floral piece fades + grows in one after another */
  .floral > div{opacity:0;transform:scale(.6);animation:bloom 1.4s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--b) + var(--i) * .18s)}
  @keyframes bloom{to{opacity:1;transform:none}}
  .names3{position:relative;width:320px;height:120px;flex:none}
  .names3 p{position:absolute;transform:translateX(-50%);font-family:'Pinyon Script',cursive}
  .dt{position:relative;width:330px;height:110px;flex:none}
  .dt p{position:absolute;transform:translateX(-50%);text-align:center;font-family:'Playfair Display',serif}
  .dt i{position:absolute;height:.8px;width:120px;background:var(--ink)}
  .agenda{display:flex;gap:40px;align-items:flex-start}
  .agenda > div{display:flex;flex-direction:column;align-items:center;gap:4px;font:10px 'Playfair Display',serif}
  .agenda img{width:36px;height:36px;display:block}
</style>
</head>
<body>
<div class="stage">
  <div class="opts"><a href="opsi-1.html">1</a><a href="opsi-2.html">2</a><a class="on" href="opsi-3.html">3</a><a href="opsi-4.html">4</a><button class="replay" type="button" aria-label="Putar ulang">&#8635;</button></div>

  <!-- floral pieces: positions taken from the Figma insets -->
  <template id="floral">
    <div style="--i:0;inset:36.88% 6.92% 3.44% 8.46%"><img style="inset:-.21% -.18% -.27% -.24%;width:calc(100% + .42%);height:calc(100% + .48%)" src="../assets/figma/stems.svg" alt=""></div>
    <div style="--i:1;inset:26.87% 60.38% 34.06% 4.62%"><img style="inset:-.4% -.55%;width:101.1%;height:100.8%" src="../assets/figma/asc-leaves.svg" alt=""></div>
    <div style="--i:2;inset:27.81% 61.14% 53.44% 28.08%"><img style="inset:-.83% -1.78%;width:103.56%;height:101.66%" src="../assets/figma/upper-bud.svg" alt=""></div>
    <div style="--i:3;inset:50.94% 4.62% 5.9% 55.77%"><img style="inset:-.36% -.49%;width:100.98%;height:100.72%" src="../assets/figma/right-leaves.svg" alt=""></div>
    <div style="--i:4;inset:54.69% 5.73% 31.94% 80.77%"><img style="inset:-1.17% -1.42% -1.17% -1.43%;width:102.85%;height:102.34%" src="../assets/figma/right-bud.svg" alt=""></div>
    <div style="--i:5;inset:61.48% 58.11% 13.11% 5%"><img style="inset:-.65% -.55%;width:101.1%;height:101.3%" src="../assets/figma/main-peony.svg" alt=""></div>
    <div style="--i:6;inset:80.33% 42.91% 3.71% 32.07%"><img style="inset:-.98% -.77%;width:101.54%;height:101.96%" src="../assets/figma/lower-peony.svg" alt=""></div>
    <div style="--i:7;inset:84.38% 67.31% 3.71% 5.89%"><img style="inset:-1.31% -.72%;width:101.44%;height:102.62%" src="../assets/figma/corner-foliage.svg" alt=""></div>
  </template>
  <div class="floral sway" id="flBL" data-anchor="bl" style="--b:1.6s;left:-12px;top:612px;transform-origin:0 100%"></div>
  <div class="abs" data-anchor="tr" style="left:193px;top:-10px;width:221px;height:272px;transform:rotate(180deg)">
    <div class="floral sway rev" id="flTR" style="--b:.2s;left:0;top:0;transform-origin:0 100%"></div>
  </div>

  <div class="content" data-anchor="cm" style="left:36px;top:132.5px;gap:6px">
    <p class="pop" style="font:900 52px/1.44 'Noto Serif SC',serif">囍</p>
    <div class="sp" style="height:14px"></div>
    <p class="play a" style="font-size:11px;letter-spacing:1.8px">TOGETHER WITH OUR FAMILIES</p>
    <div class="names3 a">
      <p style="left:112px;top:58px;font-size:46px;color:#dbb266">&amp;</p>
      <p style="left:96.5px;top:0;font-size:58px;color:#fcf2e5">Ervina</p>
      <p style="left:203px;top:46px;font-size:58px;color:#fcf2e5">William</p>
    </div>
    <div class="sp" style="height:4px"></div>
    <p class="corm a" style="font-weight:500;font-size:15px;line-height:20px">Dengan penuh sukacita mengundang Anda<br>pada acara Sangjit kami.</p>
    <div class="sp" style="height:10px"></div>
    <div class="dt a">
      <p style="left:165px;top:0;width:80px;font-size:15px">DESEMBER</p>
      <p style="left:165px;top:18px;width:80px;font-size:44px">6</p>
      <p style="left:165px;top:82px;width:80px;font-size:15px">2026</p>
      <i class="line-h l" style="--d:3s;left:0;top:38px"></i><i class="line-h l" style="--d:3.1s;left:0;top:76px"></i>
      <i class="line-h r" style="--d:3s;left:210px;top:38px"></i><i class="line-h r" style="--d:3.1s;left:210px;top:76px"></i>
      <p style="left:60px;top:46px;width:120px;font-size:16px">MINGGU</p>
      <p style="left:270px;top:46px;width:120px;font-size:16px">10.30 WIB</p>
    </div>
    <div class="sp" style="height:12px"></div>
    <div class="agenda a">
      <div><img src="../assets/figma/ic-tea.svg" alt=""><span>10.30 WIB</span><em>Tea Pai</em></div>
      <div><img src="../assets/figma/ic-hantaran.svg" alt=""><span>11.30 WIB</span><em>Hantaran</em></div>
      <div><img src="../assets/figma/ic-jamuan.svg" alt=""><span>12.30 WIB</span><em>Jamuan</em></div>
    </div>
    <div class="sp" style="height:12px"></div>
    <p class="play a" style="font-size:12px;letter-spacing:1.2px;line-height:20px">INTERCONTINENTAL BANDUNG<br>WEDDING HALL<br>JL. RESOR DAGO PAKAR RAYA 2B</p>
  </div>
</div>
<script>
  const tpl = document.getElementById('floral').innerHTML;
  document.getElementById('flBL').innerHTML = tpl;
  document.getElementById('flTR').innerHTML = tpl;
</script>
<script src="../assets/figma/opsi.js?v=202611250856"></script>
</body>
</html>
